# Publishes the static informational page in site/ with GitHub's
# supported Pages artifact and deployment workflow.
#
# The page describes the pre-alpha design and makes no shipped claim;
# the runnable release candidate remains the source of truth for the
# public surface (AGENTS.md, docs/public-surface/FACT_SHEET.md).
#
# The Pages site must be enabled once by a repository administrator;
# workflow tokens deliberately do not own that repository setting.
name: Publish project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
