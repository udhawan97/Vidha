# Publishes the static informational page in site/ to the gh-pages
# branch, which GitHub Pages serves at udhawan97.github.io/Vidha/.
#
# The page describes the pre-alpha design and makes no shipped claim;
# the runnable release candidate remains the source of truth for the
# public surface (AGENTS.md, docs/public-surface/FACT_SHEET.md).
#
# Branch publishing is used because this account's GITHUB_TOKEN cannot
# create a Pages site via the API ("Resource not accessible by
# integration" from actions/configure-pages enablement); a gh-pages
# branch activates Pages without a repository-settings step.
name: Publish project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Push site/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
