name: Request private security contact
description: Ask the maintainer to establish a private channel without disclosing vulnerability details.
title: '[Security contact request]: '
body:
  - type: markdown
    attributes:
      value: |
        Use this form only if GitHub's private vulnerability report form is unavailable. Do not describe the vulnerability, affected endpoint, exploit, credentials, personal data, or Envelope contents here. This public issue is only a request to establish a private route.
  - type: checkboxes
    id: no_details
    attributes:
      label: Public-information check
      options:
        - label: I have not included vulnerability details, personal information, credentials, or private content in this public issue.
          required: true
        - label: I will wait for a verified private route before sharing technical details.
          required: true
